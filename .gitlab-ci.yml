stages:
  - lint
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  WEB_IMAGE: $CWA_REGISTRY_IMAGE/web
  API_IMAGE: $CWA_REGISTRY_IMAGE/api
  HTTP3_IMAGE: $CWA_REGISTRY_IMAGE/http3

default:
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

# --------------------------------------------------------------------------
# Reusable sections
# --------------------------------------------------------------------------
.docker:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CWA_REGISTRY_USER" -p "$CWA_REGISTRY_PASSWORD" "$CWA_REGISTRY" # TODO: Move to using a private registry since GitLab container registry might not be provided on this gitlab instance

.write_env: &write_env
  - |
    cat > .env <<EOF
    NODE_ENV=production

    WEB_URL=$WEB_URL
    API_URL=$API_URL
    HTTP3_URL=$HTTP3_URL

    JWT_SECRET=$JWT_SECRET
    REFRESH_TOKEN_EXPIRATION_SECONDS=$REFRESH_TOKEN_EXPIRATION_SECONDS
    ACCESS_TOKEN_EXPIRATION_SECONDS=$ACCESS_TOKEN_EXPIRATION_SECONDS

    HTTP3_CERT_FILE_PATH=$HTTP3_CERT_FILE_PATH
    HTTP3_KEY_FILE_PATH=$HTTP3_KEY_FILE_PATH
    HTTP3_HOST=$HTTP3_HOST
    HTTP3_SECRET=$HTTP3_SECRET

    DB_NAME=$DB_NAME
    DB_USER=$DB_USER
    DB_PASSWORD=$DB_PASSWORD
    DB_HOST=$DB_HOST
    DB_PORT=$DB_PORT

    REDIS_HOST=$REDIS_HOST
    REDIS_PORT=$REDIS_PORT
    REDIS_PASSWORD=$REDIS_PASSWORD

    DB_HEALTHCHECK_INTERVAL=2s
    DB_HEALTHCHECK_TIMEOUT=5s
    DB_HEALTHCHECK_RETRIES=20

    API_HEALTHCHECK_INTERVAL=2s
    API_HEALTHCHECK_TIMEOUT=5s
    API_HEALTHCHECK_RETRIES=20

    REDIS_HEALTHCHECK_INTERVAL=2s
    REDIS_HEALTHCHECK_TIMEOUT=5s
    REDIS_HEALTHCHECK_RETRIES=20
    EOF

# --------------------------------------------------------------------------
# LINT
# --------------------------------------------------------------------------
compose:validate:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache docker-cli docker-cli-compose
  script:
    - *write_env
    - docker compose config -q
    - docker compose --profile full-flow config -q

dockerfile:lint:
  stage: lint
  image: hadolint/hadolint:latest-debian
  before_script: []
  script:
    - hadolint WEB/Dockerfile API/Dockerfile HTTP3/Dockerfile
  allow_failure: true

secrets:scan:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --no-banner --redact -v

# Skipping HTTP3 linting for now
app:lint:
  stage: lint
  image: node:24-alpine
  cache:
    key:
      files: [WEB/package-lock.json, API/package-lock.json]
    paths: [WEB/node_modules, API/node_modules]
  script:
    - (cd WEB && npm ci && npm run lint)
    - (cd API && npm ci && npm run lint)
  allow_failure: true

# --------------------------------------------------------------------------
# BUILD
# --------------------------------------------------------------------------
.build_template:
  stage: build
  extends: .docker
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - >
      docker build
      --cache-from "$IMAGE:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      $EXTRA_ARGS
      -t "$IMAGE:$CI_COMMIT_SHA" -t "$IMAGE:latest"
      -f "$CONTEXT/Dockerfile" "$CONTEXT"
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    - docker push "$IMAGE:latest"

build:api:
  extends: .build_template
  variables:
    IMAGE: $API_IMAGE
    CONTEXT: ./API

build:web:
  extends: .build_template
  environment:
    name: staging
  variables:
    IMAGE: $WEB_IMAGE
    CONTEXT: ./WEB
    EXTRA_ARGS: >-
      --build-arg NODE_ENV=production
      --build-arg NEXT_PUBLIC_WEB_URL=$WEB_URL
      --build-arg NEXT_PUBLIC_API_URL=$API_URL
      --build-arg NEXT_PUBLIC_HTTP3_URL=$HTTP3_URL

# --------------------------------------------------------------------------
# TEST -- unit/component tests with a JUnit report
# --------------------------------------------------------------------------
test:unit:
  stage: test
  image: node:24-alpine
  needs: []
  cache:
    key:
      files: [API/package-lock.json]
    paths: [API/node_modules]
  script:
    - cd API
    - npm ci
    - npm run test:cov
  coverage: '/^All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - API/junit.xml
    reports:
      junit: API/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: API/coverage/cobertura-coverage.xml
  allow_failure: true

# --------------------------------------------------------------------------
# DEPLOY
# --------------------------------------------------------------------------
deploy:staging:
  stage: deploy
  image: docker:27-cli
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
  before_script:
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - scp compose.yml "$DEPLOY_USER@$DEPLOY_HOST:/srv/cwa/compose.yml"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
        set -e
        mkdir -p /srv/cwa
        cd /srv/cwa

        docker login -u "$CWA_REGISTRY_USER" -p "$CWA_REGISTRY_PASSWORD" "$CWA_REGISTRY"
        export TAG=$CI_COMMIT_SHA
        export WEB_IMAGE=$WEB_IMAGE
        export API_IMAGE=$API_IMAGE
        export HTTP3_IMAGE=$HTTP3_IMAGE
        docker compose pull
        docker compose up -d --wait
        docker image prune -f
      EOF
